<html>
    <head>
        <title>Nested ordered list</title>
	</head>
	<body>
	    <h2><marquee direction = "right" bgcolor = "cyan">Nested order list</marquee><h2>
		<ol>
		    <li>Fruits</li>
			<ul>
			    <li>apple</li>
				<li>banana</li>
				<li>mango</li>
				<li>pine apple</li>
				<li>gauva</li>
			</ul>
			<li>Vegetables</li>
		    <ol>
			    <li>potato</li>
				<li>onion</li>
				<li>pumpkin</li>
				<li>tomato</li>
				<li>spinach</li>
			</ol>
		</ol>
	</body>
</html>
